# cargo-audit allow-list.
#
# Each entry documents *why* the advisory is ignored, what the upstream
# fix looks like, and who has to move for riptering to drop the entry.
# The CI workflow at .github/workflows/audit.yml runs `cargo audit
# --deny warnings` so this file is authoritative — an undocumented
# transitive regression will break the build. Remove an entry as soon as
# the locked dependency graph no longer matches the advisory.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" timing sidechannel.
    # Severity 5.9 (medium). No fixed release exists: re-checked
    # 2026-09-24 against the RustSec database, which lists rsa 0.9.10
    # (the latest stable, and the version riptering locks) and every
    # 0.10.0-rc.x pre-release as affected (`patched = []`). Riptering's
    # threat model for its direct consumers (server-side RSA private
    # operations) does include this risk. Only the RustCrypto provider
    # links `rsa` for private operations; AWS-LC builds use `rsa` solely
    # as a test-only dev-dependency. Callers for whom timing-side-channel
    # resistance is load-bearing should select the AWS-LC provider or
    # route RSA private operations through an HSM via riptering::pkcs11.
    # Upstream: https://github.com/RustCrypto/RSA/issues/626
    "RUSTSEC-2023-0071",

    # Note — dropped entries:
    # RUSTSEC-2026-0097 (rand "unsound with a custom logger") was ignored
    # by kryptering 0.5. It is patched in rand >= 0.8.6 and Cargo.lock now
    # resolves rand 0.8.7 (the only rand in the graph), so the ignore no
    # longer matches anything and was removed in riptering 0.6.0.
    #
    # Note — ml-dsa advisory posture:
    # RUSTSEC-2025-0144 (timing side-channel in ML-DSA decomposition, fixed
    # by replacing hardware division with constant-time Barrett reduction)
    # is patched in ml-dsa >= 0.1.0-rc.3. Riptering tracks ml-dsa 0.1.0
    # (the stable final, >= the patched version), so this advisory does not
    # fire against our Cargo.lock and needs no ignore entry. Revisit only if
    # ml-dsa is ever pinned backward to < 0.1.0-rc.3.
    # Upstream: https://github.com/RustCrypto/signatures/security/advisories/GHSA-hcp2-x6j4-29j7
]
