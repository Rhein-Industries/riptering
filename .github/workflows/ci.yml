name: CI

# Tests every document provider (RustCrypto and AWS-LC), PKCS#11 against
# SoftHSM2, the Linux-only AWS-LC FIPS build and macOS, on GitHub-hosted
# runners only.
#
# Publishing to crates.io is manual for now: a Rhein Industries maintainer
# runs `cargo publish` from a tagged commit after this workflow passes.
# kryptering's tag-triggered Publish workflow was removed in the fork: it used
# crates.io trusted publishing set up for the kryptering crate, and riptering
# has no trusted publisher configured yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run catches toolchain, runner image and dependency drift.
    - cron: '47 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Keep in sync with `rust-version` in Cargo.toml.
  MSRV: "1.88.0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.MSRV }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  linux:
    name: Linux providers (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The MSRV run is the full gate (clippy -D warnings and every test).
        # The stable run repeats the tests only, so a new clippy lint on a
        # new stable release does not break the build on its own.
        include:
          - toolchain: "1.88.0"
            lint: true
          - toolchain: stable
            lint: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # SoftHSM2 is the token behind the PKCS#11 integration test.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake clang pkg-config softhsm2
      - name: Clippy (every provider feature set)
        if: matrix.lint
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features post-quantum,legacy -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features aws-lc,legacy,pkcs11 -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features aws-lc,pkcs11 -- -D warnings
      - name: RustCrypto provider
        run: |
          cargo test --locked
          cargo test --locked --features post-quantum,legacy
      - name: AWS-LC provider
        run: |
          cargo test --locked --no-default-features --features aws-lc
          cargo test --locked --no-default-features --features aws-lc,legacy
      - name: TLS client configuration
        run: |
          cargo test --locked --no-default-features --features rustcrypto,tls-ring --test tls_provider
          cargo test --locked --no-default-features --features aws-lc,tls-aws-lc --test tls_provider
      - name: PKCS#11 backend against SoftHSM2
        run: |
          # Debian and Ubuntu ship the module in libsofthsm2 (pulled in by
          # softhsm2); look it up instead of hard-coding /usr/lib/softhsm.
          module=""
          while IFS= read -r path; do
            if [[ -f "$path" ]]; then
              module="$path"
              break
            fi
          done < <(dpkg -L libsofthsm2 softhsm2 2>/dev/null | grep -E '/libsofthsm2\.so$' || true)
          if [[ -z "$module" ]]; then
            echo "libsofthsm2.so not found in the installed SoftHSM2 packages" >&2
            exit 1
          fi
          echo "Using SoftHSM2 module $module"
          export RIPTERING_TEST_SOFTHSM2_MODULE="$module"
          cargo test --locked --test pkcs11_softhsm -- --nocapture
          cargo test --locked --no-default-features --features aws-lc,pkcs11 --test pkcs11_softhsm -- --nocapture
      - name: AWS-LC builds exclude RustCrypto primitives
        if: matrix.lint
        run: |
          tree="$RUNNER_TEMP/riptering-aws-lc-tree.txt"
          cargo tree --locked --no-default-features --features aws-lc,legacy,pkcs11 -e normal --prefix none > "$tree"
          forbidden='^(rsa|dsa|ecdsa|p256|p384|p521|ed25519-dalek|x25519-dalek|aes|aes-gcm|aes-kw|cbc|des|sha1|sha2|sha3|hmac|hkdf|pbkdf2|md-5|ripemd|ml-dsa|slh-dsa|ml-kem) v'
          if grep -E "$forbidden" "$tree"; then
            echo "::error::AWS-LC build includes a RustCrypto primitive implementation"
            exit 1
          fi
      - name: Invalid provider combinations fail to compile
        if: matrix.lint
        run: |
          if cargo check --locked --no-default-features --features rustcrypto,aws-lc; then
            echo "::error::multiple document providers unexpectedly compiled"
            exit 1
          fi
          if cargo check --locked --no-default-features; then
            echo "::error::missing document provider unexpectedly compiled"
            exit 1
          fi
          if cargo check --locked --no-default-features --features rustcrypto,tls-ring,tls-aws-lc; then
            echo "::error::multiple TLS providers unexpectedly compiled"
            exit 1
          fi
      - name: API documentation
        if: matrix.lint
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --locked --no-deps
          cargo doc --locked --no-deps --no-default-features --features rustcrypto,legacy,post-quantum,pkcs11,tls-ring
          cargo doc --locked --no-deps --no-default-features --features aws-lc,legacy,pkcs11,tls-aws-lc

  fips:
    name: AWS-LC FIPS provider (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.MSRV }}
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Go is required to build the AWS-LC FIPS module.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake clang golang-go pkg-config
      - name: Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features fips,tls-aws-lc,pkcs11 -- -D warnings
      - name: Tests (initialization, attestation, known answers, parity, baseline)
        run: cargo test --locked --no-fail-fast --no-default-features --features fips,tls-aws-lc
      - name: Invalid FIPS provider combinations fail to compile
        run: |
          if cargo check --locked --no-default-features --features rustcrypto,fips; then
            echo "::error::FIPS unexpectedly compiled with RustCrypto document crypto"
            exit 1
          fi
          if cargo check --locked --no-default-features --features fips,tls-ring; then
            echo "::error::FIPS unexpectedly compiled with ring TLS"
            exit 1
          fi

  macos:
    name: macOS (default and non-FIPS AWS-LC)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.MSRV }}
          components: clippy
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features aws-lc,legacy,pkcs11 -- -D warnings
      - name: RustCrypto provider
        run: |
          cargo test --locked
          cargo test --locked --features post-quantum,legacy
      - name: AWS-LC provider (non-FIPS)
        run: |
          cargo test --locked --no-default-features --features aws-lc
          cargo test --locked --no-default-features --features aws-lc,legacy
          cargo test --locked --no-default-features --features aws-lc,tls-aws-lc --test tls_provider
